name: Check Upstream Release & Publish Docker Image

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Latest Bitwarden CLI Version
        id: fetch-version
        run: |
          # Fetch the latest CLI release tag from official bitwarden/clients repo
          LATEST_TAG=$(curl -s https://api.github.com/repos/bitwarden/clients/releases | jq -r '[.[] | select(.tag_name | startswith("cli-v"))][0].tag_name')
          VERSION="${LATEST_TAG#cli-v}"
          
          echo "latest_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found upstream CLI version: $VERSION"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args:
            BW_VERSION=${{ steps.fetch-version.outputs.latest_version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/bitwarden-cli:latest
            ghcr.io/${{ github.repository_owner }}/bitwarden-cli:${{ steps.fetch-version.outputs.latest_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max